name: Deploy React App to Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Resolve deployment path
        id: vars
        run: |
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "deploy_path=${{ secrets.PROD_SERVER_DEPLOYMENT_PATH }}" >> $GITHUB_OUTPUT
          else
            echo "deploy_path=${{ secrets.DEV_SERVER_DEPLOYMENT_PATH }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare target directory
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ steps.vars.outputs.deploy_path }}"
            find "${{ steps.vars.outputs.deploy_path }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Upload dist folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "${{ steps.vars.outputs.deploy_path }}"
          strip_components: 1

      - name: Set permissions
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            chmod -R 755 "${{ steps.vars.outputs.deploy_path }}"